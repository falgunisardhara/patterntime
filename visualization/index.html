
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatternTime | Time-Series Explorer</title>

    <script src="../node_modules/echarts/dist/echarts.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px;
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .dashboard {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
        }

        .panel {
            padding: 24px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        select {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        #status {
            color: #64748b;
            font-size: 14px;
        }

        #chart {
            width: 100%;
            height: 480px;
        }

        .note {
            margin-top: 16px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .panel {
                padding: 14px;
            }

            #chart {
                height: 380px;
            }
        }
    </style>
</head>
<body>
    <main class="dashboard">
        <header class="header">
            <h1>PatternTime</h1>
            <p>Explore metrics over time and investigate significant changes.</p>
        </header>

        <section class="panel">
            <div class="controls">
                <label for="metric">Select metric:</label>

                <select id="metric">
                    <option value="response_time_ms">Response Time (ms)</option>
                    <option value="failed_requests">Failed Requests</option>
                    <option value="requests_per_minute">Requests per Minute</option>
                </select>

                <span id="status">Loading dataset...</span>
            </div>

            <div id="chart"></div>

            <p class="note">
                The dashed line marks the known change deliberately
                introduced into this simulated dataset. It is a reference
                point, not an AI detection result.
            </p>
        </section>
    </main>

    <script>
        const chartElement = document.getElementById("chart");
        const metricSelector = document.getElementById("metric");
        const statusElement = document.getElementById("status");

        const chart = echarts.init(chartElement);

        let timestamps = [];
        let dataset = [];
        let changeIndex = -1;

        const metricSettings = {
            response_time_ms: {
                label: "Response Time",
                unit: "ms"
            },
            failed_requests: {
                label: "Failed Requests",
                unit: "requests"
            },
            requests_per_minute: {
                label: "Requests per Minute",
                unit: "requests/min"
            }
        };

        async function loadDataset() {
            try {
                const response = await fetch("../data/sample_api_metrics.csv");

                if (!response.ok) {
                    throw new Error("Could not load the CSV file.");
                }

                const csvText = await response.text();
                const rows = csvText.trim().split(/\r?\n/);
                const headers = rows[0].split(",");

                dataset = rows.slice(1).map(row => {
                    const values = row.split(",");
                    const record = {};

                    headers.forEach((header, index) => {
                        record[header] = values[index];
                    });

                    return record;
                });

                timestamps = dataset.map(row => row.timestamp);

                changeIndex = dataset.findIndex(
                    row => Number(row.is_after_change) === 1
                );

                if (dataset.length === 0 || changeIndex < 0) {
                    throw new Error("Dataset or known change point is missing.");
                }

                statusElement.textContent =
                    `${dataset.length} observations loaded`;

                updateChart();
            } catch (error) {
                statusElement.textContent = "Could not load dataset";
                chartElement.innerHTML =
                    '<p style="color:#b91c1c;padding:20px;">' +
                    'Error: ' + error.message +
                    '. Start the local server from the project root and reload.' +
                    '</p>';

                console.error(error);
            }
        }

        function updateChart() {
            const metric = metricSelector.value;
            const settings = metricSettings[metric];

            const values = dataset.map(row => Number(row[metric]));

            chart.setOption({
                title: {
                    text: settings.label + " Over Time",
                    left: "center",
                    textStyle: {
                        fontSize: 18
                    }
                },

                tooltip: {
                    trigger: "axis",
                    formatter: function (items) {
                        const item = items[0];
                        const timestamp = timestamps[item.dataIndex];

                        return (
                            timestamp +
                            "<br/>" +
                            item.marker +
                            settings.label +
                            ": <strong>" +
                            item.value +
                            " " + settings.unit +
                            "</strong>"
                        );
                    }
                },

                grid: {
                    left: 65,
                    right: 30,
                    top: 75,
                    bottom: 105
                },

                xAxis: {
                    type: "category",
                    data: timestamps,
                    boundaryGap: false,
                    axisLabel: {
                        formatter: function (value) {
                            return value.slice(11, 16);
                        }
                    }
                },

                yAxis: {
                    type: "value",
                    name: settings.unit,
                    scale: true
                },

                dataZoom: [
                    {
                        type: "inside",
                        start: 0,
                        end: 100
                    },
                    {
                        type: "slider",
                        start: 0,
                        end: 100,
                        bottom: 25
                    }
                ],

                series: [{
                    name: settings.label,
                    type: "line",
                    data: values,
                    smooth: false,
                    showSymbol: false,
                    lineStyle: {
                        width: 2
                    },
                    markLine: {
                        symbol: ["none", "none"],
                        lineStyle: {
                            type: "dashed",
                            width: 2
                        },
                        label: {
                            formatter: "Known change (15:00)",
                            position: "insideEndTop"
                        },
                        data: [{
                            xAxis: timestamps[changeIndex]
                        }]
                    }
                }]
            }, true);
        }

        metricSelector.addEventListener("change", updateChart);

        window.addEventListener("resize", function () {
            chart.resize();
        });

        loadDataset();
    </script>
</body>
</html>
